name: oma-release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Restore annotated release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

      - name: Validate release tag signature
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          baseline="$(git rev-parse --verify "$tag_commit^")"
          scripts/validate_release_tag.sh "$RELEASE_TAG" "$baseline"

      - name: Build and verify release ISO in Arch Linux
        env:
          OMA_RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${OMA_RELEASE_VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          docker run --privileged --rm \
            -e OMA_RELEASE_VERSION="$version" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -euc '
              pacman -Syu --noconfirm --needed archiso git jq make python
              ./oma build --arch x86_64 --profile minimal --version "$OMA_RELEASE_VERSION"
              (cd output && sha256sum -c SHA256SUMS)
            '

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Oh My Arch $GITHUB_REF_NAME" \
            --notes-file "releases/$GITHUB_REF_NAME.md" \
            output/*.iso output/SHA256SUMS output/*.manifest.json
