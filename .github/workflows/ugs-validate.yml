name: ugs-validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ugs-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Validate persisted CR and generated PR body
        if: github.event_name == 'pull_request'
        run: adapters/github/validate_pr.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" "$GITHUB_EVENT_PATH"
      - name: Validate persisted CR coverage on main
        if: github.ref == 'refs/heads/main'
        run: scripts/validate_main_cr_range.sh "${{ github.event.before }}" "${{ github.sha }}"
      - name: Validate trusted commit signatures
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zeros=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
            baseline="$PR_BASE_SHA"
          elif [ "$PUSH_BEFORE_SHA" = "$zeros" ]; then
            echo 'signature validation requires a pre-existing trusted baseline' >&2
            exit 1
          else
            range="$PUSH_BEFORE_SHA..$PUSH_SHA"
            baseline="$PUSH_BEFORE_SHA"
          fi
          scripts/validate_commit_signatures.sh "$range" "$baseline"
      - name: Validate UGS standard policy
        run: |
          scripts/validate_policy_manifest.sh
          scripts/validate_quality_profile.sh
          scripts/validate_supply_chain_profile.sh
          scripts/validate_action_pinning.sh
          scripts/validate_repository_shape.sh
          if [ -f .ugs/document-map.json ]; then
            scripts/validate_document_map.py
          fi
